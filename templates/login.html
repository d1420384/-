{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-lg border-0 rounded-4 glass-card">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <div class="fs-1 mb-2">🥗</div>
                    <h3 class="fw-bold text-gradient">{% if is_register %}加入我們{% else %}歡迎回來{% endif %}</h3>
                    <p class="text-muted">讓健康飲食變得簡單且無壓力</p>
                </div>

                {% if error %}
                <div class="alert alert-danger rounded-3" role="alert">
                    {{ error }}
                </div>
                {% endif %}

                <form method="POST" action="{{ url_for('register') if is_register else url_for('login') }}">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control rounded-3" id="username" name="username" placeholder="使用者名稱" required>
                        <label for="username">使用者名稱</label>
                    </div>
                    <div class="form-floating mb-4">
                        <input type="password" class="form-control rounded-3" id="password" name="password" placeholder="密碼" required>
                        <label for="password">密碼</label>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-bold btn-gradient shadow-sm">
                        {% if is_register %}註冊帳號{% else %}登入{% endif %}
                    </button>
                </form>

                <div class="text-center mt-4">
                    {% if is_register %}
                        <span class="text-muted">已經有帳號了？</span> <a href="{{ url_for('login') }}" class="text-decoration-none fw-bold">立即登入</a>
                    {% else %}
                        <span class="text-muted">還沒有帳號？</span> <a href="{{ url_for('register') }}" class="text-decoration-none fw-bold">馬上註冊</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
