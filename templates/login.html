{% extends 'base.html' %}

{% block title %}登入 - 營養均衡小幫手{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow border-0 rounded-4 glass-card">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <div class="bg-success text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3 shadow" style="width: 60px; height: 60px;">
                        <i class="bi bi-box-arrow-in-right fs-3"></i>
                    </div>
                    <h2 class="fw-bold">會員登入</h2>
                    <p class="text-muted">歡迎回來，繼續記錄您的健康飲食！</p>
                </div>
                
                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">帳號</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control border-start-0 ps-0" id="username" name="username" required placeholder="請輸入帳號">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">密碼</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" required placeholder="請輸入密碼">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success w-100 py-2 fw-bold rounded-pill shadow-sm mb-3">登入</button>
                    <div class="text-center">
                        <span class="text-muted">還沒有帳號嗎？</span> <a href="{{ url_for('register') }}" class="text-success fw-bold text-decoration-none">立即註冊</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
