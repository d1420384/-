{% extends 'base.html' %}

{% block title %}註冊 - 營養均衡小幫手{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card glass-card hover-shadow border-0 shadow-lg">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <div class="bg-success text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3 shadow" style="width: 60px; height: 60px; background: var(--primary-gradient) !important;">
                        <i class="bi bi-person-plus fs-3"></i>
                    </div>
                    <h3 class="fw-bold text-dark">建立帳號</h3>
                    <p class="text-muted">加入健康生活，開始您的飲食管理旅程</p>
                </div>
                
                <form method="POST" action="{{ url_for('register') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-bold text-dark">設定帳號名稱</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 border-2 rounded-start-3"><i class="bi bi-person text-success"></i></span>
                            <input type="text" class="form-control border-start-0 border-2 rounded-end-3 ps-0 form-control-lg fs-6" id="username" name="username" required placeholder="請輸入欲設定的帳號">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label fw-bold text-dark">設定密碼</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 border-2 rounded-start-3"><i class="bi bi-lock text-success"></i></span>
                            <input type="password" class="form-control border-start-0 border-2 rounded-end-3 ps-0 form-control-lg fs-6" id="password" name="password" required placeholder="請設定密碼">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success w-100 py-3 fw-bold btn-rounded shadow-sm mb-3">立即註冊</button>
                    <div class="text-center mt-3">
                        <span class="text-muted">已經有帳號了？</span> 
                        <a href="{{ url_for('login') }}" class="text-success fw-bold text-decoration-none ms-1">返回登入</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
